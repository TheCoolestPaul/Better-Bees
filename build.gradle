plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.144' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
    id 'idea'
}

version = mod_version
group = mod_group_id

def versionProjects = subprojects.findAll { it.name.startsWith('mc') || it.name.startsWith('fabricMc') }

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Minecraft artifact.'
    dependsOn(versionProjects.collect { it.tasks.named('build') })
}

tasks.register('gameTestAll') {
    group = 'verification'
    description = 'Runs the GameTest server for every supported Minecraft artifact.'
    dependsOn(versionProjects.collect { p -> p.tasks.named(p.name.startsWith('fabricMc') ? 'runGameTest' : 'runGameTestServer') })
}

tasks.register('buildNeoForgeAll') {
    group = 'build'
    dependsOn(versionProjects.findAll { it.name.startsWith('mc') }.collect { it.tasks.named('build') })
}

tasks.register('buildFabricAll') {
    group = 'build'
    dependsOn(versionProjects.findAll { it.name.startsWith('fabricMc') }.collect { it.tasks.named('build') })
}

tasks.named('assemble') {
    dependsOn(versionProjects.collect { it.tasks.named('assemble') })
}

tasks.named('clean') {
    dependsOn(versionProjects.collect { it.tasks.named('clean') })
}

tasks.named('check') {
    dependsOn(versionProjects.collect { it.tasks.named('check') })
    dependsOn 'performancePolicyTest'
}

def policyClasses = layout.buildDirectory.dir('performancePolicyClasses')
tasks.register('compilePerformancePolicyTest', JavaCompile) {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    javaCompiler = project(':mc1_21_1').javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    source files('src/main/java/com/betterbees/hive/HiveRuntimeState.java',
            'src/main/java/com/betterbees/audio/BeeLoopSelector.java',
            'src/test/java/com/betterbees/PerformancePolicyTest.java')
    classpath = files()
    destinationDirectory = policyClasses
    options.release = 21
}
tasks.register('performancePolicyTest', JavaExec) {
    group = 'verification'
    dependsOn 'compilePerformancePolicyTest'
    classpath = files(policyClasses)
    mainClass = 'com.betterbees.PerformancePolicyTest'
    javaLauncher = project(':mc1_21_1').javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

idea.project.languageLevel = '25'
