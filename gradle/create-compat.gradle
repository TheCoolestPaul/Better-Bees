// Only the NeoForge 1.21.1 artifact includes the optional Create integration.
def withCreate = providers.gradleProperty('withCreate').map { it.toBoolean() }.getOrElse(false)
repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
dependencies {
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    compileOnly('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67') { transitive = false }
    if (withCreate) {
        localRuntime('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
        localRuntime('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
        localRuntime('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67') { transitive = false }
        localRuntime('dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6') { transitive = false }
    }
}
tasks.named('compileJava', JavaCompile) {
    source(rootProject.file('compat/create/src/main/java'))
    if (withCreate) source(rootProject.file('compat/create/src/gametest/java'))
}
tasks.named('processResources', ProcessResources) {
    from(rootProject.file('compat/create/src/main/resources'))
}
tasks.named('generateModMetadata', ProcessResources) {
    doLast {
        def metadata = destinationDir.toPath().resolve('META-INF/neoforge.mods.toml').toFile()
        metadata.append('''
[[mixins]]
config="betterbees.create.mixins.json"
[[dependencies.betterbees]]
modId="create"
type="optional"
versionRange="[6.0.10,6.1)"
ordering="AFTER"
side="BOTH"
''')
    }
}
