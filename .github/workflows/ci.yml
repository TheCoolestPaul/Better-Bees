name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test version resolver
        run: python3 scripts/ci/test-resolve-version.py
      - name: Check release shell scripts
        run: bash -n scripts/ci/smoke-launch.sh scripts/ci/verify-jar.sh

  compatibility:
    name: NeoForge ${{ matrix.neo_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        neo_version: ['21.1.1', '21.1.50', '21.1.213', '21.1.248']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run GameTests
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neo_version }} build runGameTestServer
