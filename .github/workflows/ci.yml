name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test version resolver
        run: python3 scripts/ci/test-resolve-version.py
      - name: Test and validate Modrinth metadata
        shell: bash
        run: |
          set -euo pipefail
          jade_range="$(sed -n 's/^jade_version_range=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          version_type=release
          if [[ "$mod_version" == *-* ]]; then
            version_type=beta
          fi
          python3 scripts/ci/test-validate-modrinth-release.py
          python3 scripts/ci/validate-modrinth-release.py \
            --manifest .github/modrinth-dependencies.json \
            --jade-version-range "$jade_range" \
            --expected-version "$mod_version" \
            --game-version 1.21.1 \
            --version-type "$version_type"
      - name: Check release shell scripts
        run: bash -n scripts/ci/smoke-launch.sh scripts/ci/verify-jar.sh

  compatibility:
    name: NeoForge ${{ matrix.neo_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        neo_version: ['21.1.1', '21.1.50', '21.1.213', '21.1.248']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run GameTests
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neo_version }} build runGameTestServer

  jade_compatibility:
    name: Jade ${{ matrix.jade_version }} / NeoForge ${{ matrix.neo_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - neo_version: '21.1.1'
            jade_version: '15.1.6+neoforge'
          - neo_version: '21.1.248'
            jade_version: '15.10.6+neoforge'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and run GameTests with Jade
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neo_version }} -PwithJade=true -Pjade_version=${{ matrix.jade_version }} build runGameTestServer
