name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrices:
    runs-on: ubuntu-latest
    outputs:
      neo: ${{ steps.matrix.outputs.neo }}
      neo_jade: ${{ steps.matrix.outputs.neo_jade }}
      fabric: ${{ steps.matrix.outputs.fabric }}
      quilt: ${{ steps.matrix.outputs.quilt }}
      fabric_jade: ${{ steps.matrix.outputs.fabric_jade }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          echo "neo=$(python3 scripts/ci/target-matrix.py neo)" >> "$GITHUB_OUTPUT"
          echo "neo_jade=$(python3 scripts/ci/target-matrix.py neo-jade)" >> "$GITHUB_OUTPUT"
          echo "fabric=$(python3 scripts/ci/target-matrix.py fabric)" >> "$GITHUB_OUTPUT"
          echo "quilt=$(python3 scripts/ci/target-matrix.py quilt)" >> "$GITHUB_OUTPUT"
          echo "fabric_jade=$(python3 scripts/ci/target-matrix.py fabric-jade)" >> "$GITHUB_OUTPUT"

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ci/test-resolve-version.py && python3 scripts/ci/test-validate-modrinth-release.py
      - run: bash -n scripts/ci/smoke-launch.sh scripts/ci/verify-jar.sh scripts/ci/world-upgrade.sh
      - run: |
          python3 -m json.tool gradle/targets.json >/dev/null
          for kind in neo neo-jade fabric quilt fabric-jade package; do python3 scripts/ci/target-matrix.py "$kind" | python3 -m json.tool >/dev/null; done

  neoforge:
    needs: matrices
    name: NeoForge ${{ matrix.minecraft }} / ${{ matrix.neo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.neo) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '${{ matrix.java }}', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neo }} :${{ matrix.project }}:build :${{ matrix.project }}:runGameTestServer

  neoforge_jade:
    needs: matrices
    name: NeoForge+Jade ${{ matrix.minecraft }} / ${{ matrix.jade }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.neo_jade) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '${{ matrix.java }}', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neo }} -Pjade_version=${{ matrix.jade }} -PwithJade=true :${{ matrix.project }}:build :${{ matrix.project }}:runGameTestServer

  fabric:
    needs: matrices
    name: Fabric ${{ matrix.minecraft }} / Loader ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.fabric) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '${{ matrix.java }}', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon -Pfabric_target=${{ matrix.project }} -Pfabric_loader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.api }} :${{ matrix.project }}:build

  quilt:
    needs: matrices
    name: Quilt ${{ matrix.minecraft }} / Loader ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.quilt) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '${{ matrix.java }}', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon -Pfabric_target=${{ matrix.project }} -PwithQuilt=true -Pquilt_loader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.api }} :${{ matrix.project }}:build

  fabric_quilt_jade:
    needs: matrices
    name: ${{ matrix.platform }}+Jade ${{ matrix.minecraft }} / ${{ matrix.jade }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.fabric_jade) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { java-version: '${{ matrix.java }}', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6
      - if: matrix.platform == 'fabric'
        run: ./gradlew --no-daemon -Pfabric_target=${{ matrix.project }} -PwithJade=true -Pfabric_loader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.api }} -Pjade_version=${{ matrix.jade }} :${{ matrix.project }}:build
      - if: matrix.platform == 'quilt'
        run: ./gradlew --no-daemon -Pfabric_target=${{ matrix.project }} -PwithQuilt=true -PwithJade=true -Pquilt_loader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.api }} -Pjade_version=${{ matrix.jade }} :${{ matrix.project }}:build
