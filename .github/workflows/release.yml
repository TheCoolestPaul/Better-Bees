name: Release
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Version to release
        required: true
        default: current
        type: choice
        options: [current, patch, minor, major, custom]
      custom_version:
        description: Strict SemVer used only for custom
        required: false
        type: string
permissions: { contents: read }
concurrency: { group: release-main, cancel-in-progress: false }

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      current: ${{ steps.version.outputs.current_version }}
      version: ${{ steps.version.outputs.release_version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.is_prerelease }}
      modrinth_type: ${{ steps.version.outputs.modrinth_version_type }}
      publish: ${{ steps.matrix.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: history
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          tag="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name // ""')"
          [[ -z "$tag" ]] && echo version=none >> "$GITHUB_OUTPUT" || echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          LAST_RELEASE: ${{ steps.history.outputs.version }}
        run: python3 scripts/ci/resolve-version.py --mode "$RELEASE_MODE" --custom-version "$CUSTOM_VERSION" --last-release "$LAST_RELEASE" --github-output "$GITHUB_OUTPUT"
      - run: python3 scripts/ci/test-resolve-version.py
      - id: matrix
        run: |
          echo "publish=$(python3 scripts/ci/target-matrix.py package)" >> "$GITHUB_OUTPUT"
      - run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Better Bees release

          \`\`\`text
          Current project version: ${{ steps.version.outputs.current_version }}
          Last published release: ${{ steps.version.outputs.last_release }}
          Requested mode: ${{ inputs.release_mode }}
          Release version: ${{ steps.version.outputs.release_version }}
          Tag: ${{ steps.version.outputs.tag }}
          \`\`\`
          EOF

  validation:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}

  package:
    needs: [resolve, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.resolve.outputs.sha }}' }
      - run: sed -i 's/^mod_version=.*/mod_version=${{ needs.resolve.outputs.version }}/' gradle.properties
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon clean assemble
      - name: Verify and checksum all target jars
        env: { VERSION: '${{ needs.resolve.outputs.version }}' }
        run: |
          mkdir release-assets
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          targets=json.load(open('gradle/targets.json'))
          version=os.environ['VERSION']
          out=pathlib.Path('release-assets')
          for mc,t in targets.items():
              artifacts = (
                  ('neoforge', pathlib.Path('versions')/mc/'build/libs', t['neoRange'], t['jadeRange']),
                  ('fabric', pathlib.Path('fabric-versions')/mc/'build/libs', t['fabricLoaderRange'], t['fabricJadeRange']),
              )
              for platform,folder,loader_range,jade_range in artifacts:
                  name=f'betterbees-{version}-{platform}-{mc}.jar'
                  source=folder/name
                  dest=out/name
                  dest.write_bytes(source.read_bytes())
                  subprocess.run(['bash','scripts/ci/verify-jar.sh',platform,str(dest),version,mc,str(t['java']),loader_range,t['minecraftRange'],jade_range],check=True)
          PY
          cd release-assets
          sha256sum *.jar > SHA256SUMS
          while read -r hash file; do printf '%s  %s\n' "$hash" "$file" > "$file.sha256"; done < SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: betterbees-${{ needs.resolve.outputs.version }}-validated
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  publish_github:
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs: { commit: '${{ steps.git.outputs.commit }}' }
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.resolve.outputs.sha }}', fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: 'betterbees-${{ needs.resolve.outputs.version }}-validated', path: release-assets }
      - name: Commit version and tag
        id: git
        env: { VERSION: '${{ needs.resolve.outputs.version }}', TAG: '${{ needs.resolve.outputs.tag }}', SHA: '${{ needs.resolve.outputs.sha }}' }
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SHA" ]] || { echo 'main changed; rerun release' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -i "s/^mod_version=.*/mod_version=$VERSION/" gradle.properties
          if ! git diff --quiet; then git add gradle.properties && git commit -m "Release $VERSION"; fi
          commit="$(git rev-parse HEAD)"
          existing="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$commit" ]]; then echo "$TAG already identifies $existing" >&2; exit 1; fi
          if [[ -z "$existing" ]]; then git tag -a "$TAG" -m "Better Bees $VERSION"; git push --atomic origin HEAD:refs/heads/main refs/tags/$TAG; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ needs.resolve.outputs.tag }}', VERSION: '${{ needs.resolve.outputs.version }}', PRE: '${{ needs.resolve.outputs.prerelease }}' }
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(); [[ "$PRE" == true ]] && args+=(--prerelease)
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "Better Bees $VERSION" "${args[@]}"
          fi
          gh release view "$TAG" --json body --jq .body > release-assets/release-notes.md
      - uses: actions/upload-artifact@v7
        with: { name: release-notes, path: release-assets/release-notes.md, overwrite: true }

  publish_modrinth:
    needs: [resolve, package, publish_github]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.publish) }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.resolve.outputs.sha }}' }
      - uses: actions/download-artifact@v8
        with: { name: 'betterbees-${{ needs.resolve.outputs.version }}-validated', path: release-assets }
      - uses: actions/download-artifact@v8
        with: { name: release-notes, path: release-assets }
      - name: Validate or recover matching Modrinth version
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VERSION_TYPE: ${{ needs.resolve.outputs.modrinth_type }}
          MC: ${{ matrix.minecraft }}
          PLATFORM: ${{ matrix.platform }}
          JADE_RANGE: ${{ matrix.jadeRange }}
          FABRIC_API_RANGE: ${{ matrix.fabricApiRange }}
          LOADERS: ${{ matrix.loaders }}
        run: |
          python3 - <<'PY'
          import json, os
          deps=[{'name':'Jade','project_id':'nvQzSEkH','dependency_type':'optional','version_range':os.environ['JADE_RANGE']}]
          if os.environ['PLATFORM']=='fabric':
              deps.append({'name':'Fabric API','project_id':'P7dR8mSH','dependency_type':'required','version_range':os.environ['FABRIC_API_RANGE']})
          json.dump({'dependencies':deps}, open('/tmp/dependencies.json','w'))
          PY
          loaders=(); for loader in $LOADERS; do loaders+=(--loader "$loader"); done
          python3 scripts/ci/validate-modrinth-release.py \
            --manifest /tmp/dependencies.json --jade-version-range "$JADE_RANGE" \
            --expected-version "$VERSION+$PLATFORM.mc$MC" --target-project zMjnE1QT "${loaders[@]}" \
            --game-version "$MC" --version-type "$VERSION_TYPE" \
            --artifact "release-assets/betterbees-$VERSION-$PLATFORM-$MC.jar" \
            --display-name "Better Bees $VERSION ($PLATFORM) for Minecraft $MC" --online
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        if: steps.modrinth.outputs.publish == 'true'
        with:
          modrinth-id: zMjnE1QT
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: release-assets/betterbees-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.minecraft }}.jar
          modrinth-name: Better Bees ${{ needs.resolve.outputs.version }} (${{ matrix.platform }}) for Minecraft ${{ matrix.minecraft }}
          modrinth-version: ${{ needs.resolve.outputs.version }}+${{ matrix.platform }}.mc${{ matrix.minecraft }}
          modrinth-version-type: ${{ needs.resolve.outputs.modrinth_type }}
          modrinth-changelog-file: release-assets/release-notes.md
          modrinth-loaders: ${{ matrix.loaders }}
          modrinth-game-versions: ${{ matrix.minecraft }}
          modrinth-game-version-filter: none
          modrinth-dependencies: ${{ steps.modrinth.outputs.dependencies }}
          modrinth-java: ${{ matrix.java }}
          modrinth-retry-attempts: 3
          modrinth-fail-mode: fail
      - name: Verify Modrinth publication
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VERSION_TYPE: ${{ needs.resolve.outputs.modrinth_type }}
          MC: ${{ matrix.minecraft }}
          PLATFORM: ${{ matrix.platform }}
          JADE_RANGE: ${{ matrix.jadeRange }}
          LOADERS: ${{ matrix.loaders }}
        run: |
          loaders=(); for loader in $LOADERS; do loaders+=(--loader "$loader"); done
          python3 scripts/ci/validate-modrinth-release.py \
            --manifest /tmp/dependencies.json --jade-version-range "$JADE_RANGE" \
            --expected-version "$VERSION+$PLATFORM.mc$MC" --target-project zMjnE1QT "${loaders[@]}" \
            --game-version "$MC" --version-type "$VERSION_TYPE" \
            --artifact "release-assets/betterbees-$VERSION-$PLATFORM-$MC.jar" \
            --display-name "Better Bees $VERSION ($PLATFORM) for Minecraft $MC" --online --expect-existing
